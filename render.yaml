services:
  - type: web
    name: salon-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: EMAIL_MODE
        value: safe
      - key: AD_STORAGE
        value: s3
      - key: AD_S3_BUCKET
        sync: false
      - key: AD_S3_REGION
        value: auto
      - key: AD_S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
