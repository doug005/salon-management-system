services:
  - type: web
    name: salon-api
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: EMAIL_MODE
        value: safe
